<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Gradiente para la moneda posterior -->
    <linearGradient id="coinGoldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Gradiente para la moneda principal delantera -->
    <linearGradient id="coinGoldFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gradiente de resplandor para el borde -->
    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Sombra suave para separar monedas -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Contenedor redondeado oscuro de alto contraste para destacar en pestañas claras y oscuras -->
  <rect width="48" height="48" rx="13" fill="#0c0e14"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Moneda 1: Fondo / Derecha superior -->
  <g filter="url(#shadow)">
    <circle cx="29" cy="19" r="12" fill="url(#coinGoldBack)" stroke="#FDE68A" stroke-width="1.2"/>
    <circle cx="29" cy="19" r="8.5" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="2 1"/>
    <circle cx="29" cy="19" r="4.5" fill="#FACC15" opacity="0.9"/>
    <circle cx="29" cy="19" r="2.5" fill="#CA8A04" opacity="0.6"/>
  </g>

  <!-- Moneda 2: Frente / Izquierda inferior con símbolo S/ -->
  <g filter="url(#shadow)">
    <circle cx="19" cy="29" r="13" fill="url(#coinGoldFront)" stroke="#FEF9C3" stroke-width="1.5"/>
    <circle cx="19" cy="29" r="9.5" fill="none" stroke="#92400E" stroke-width="1.2" stroke-dasharray="2.5 1"/>
    <text x="19" y="34.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="-0.5">S/</text>
  </g>

  <!-- Destello / Brillo estelar en la esquina superior derecha -->
  <path d="M 38 8 Q 38 12 42 12 Q 38 12 38 16 Q 38 12 34 12 Q 38 12 38 8 Z" fill="#FEF08A"/>
  <circle cx="38" cy="12" r="1" fill="#FFFFFF"/>
</svg>
