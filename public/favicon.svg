<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Filtros de Sombra e Iluminación 3D -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="subtleBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>

    <!-- Gradientes de Color Fieles a la Referencia -->
    <!-- Barra Superior (Azul / Cyan Cerúleo) -->
    <linearGradient id="topBlueGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#8bcbf2"/>
      <stop offset="25%" stop-color="#65a4cf"/>
      <stop offset="65%" stop-color="#4e88b2"/>
      <stop offset="100%" stop-color="#315f83"/>
    </linearGradient>

    <!-- Barra Media (Blanco Perla / Platino) -->
    <linearGradient id="midWhiteGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Barra Inferior (Azul Cerúleo Profundo) -->
    <linearGradient id="botBlueGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#79bce4"/>
      <stop offset="35%" stop-color="#5692bc"/>
      <stop offset="75%" stop-color="#427a9f"/>
      <stop offset="100%" stop-color="#2a5374"/>
    </linearGradient>

    <!-- Bisel de Borde Superior para Efecto 3D Tecla/Píldora -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Fondo Redondeado Oscuro para destacar en pestañas claras/oscuras y móvil -->
  <rect width="1024" height="1024" rx="230" fill="#0c0d12"/>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>

  <!-- GRUPO LOGO "F" VECTORIAL -->
  <g filter="url(#dropShadow)">

    <!-- 1. BARRA SUPERIOR (Ala Azul que asciende hacia la derecha superior) -->
    <g>
      <!-- Sombra inferior de bisel 3D -->
      <path
        d="M 236 248
           C 236 236 245 228 258 228
           L 582 228
           C 596 228 610 223 621 214
           L 824 103
           C 836 96 852 105 852 120
           L 852 248
           C 852 258 846 268 837 274
           L 661 387
           C 651 394 639 398 627 398
           L 258 398
           C 245 398 236 390 236 378
           Z"
        fill="#1e3e57"
        transform="translate(0, 10)"
      />
      <!-- Cara frontal principal -->
      <path
        d="M 236 248
           C 236 236 245 228 258 228
           L 582 228
           C 596 228 610 223 621 214
           L 824 103
           C 836 96 852 105 852 120
           L 852 248
           C 852 258 846 268 837 274
           L 661 387
           C 651 394 639 398 627 398
           L 258 398
           C 245 398 236 390 236 378
           Z"
        fill="url(#topBlueGrad)"
        stroke="url(#bevelLight)"
        stroke-width="7"
      />
      <!-- Brillo de bisel superior interno -->
      <path
        d="M 246 244
           C 246 238 250 235 258 235
           L 582 235
           C 594 235 606 230 615 223
           L 822 110"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.45"
      />
    </g>

    <!-- 2. BARRA MEDIA (Bloque Horizontal Blanco con corte diagonal derecho) -->
    <g>
      <!-- Sombra inferior de bisel 3D -->
      <path
        d="M 236 450
           C 236 438 245 430 258 430
           L 688 430
           C 700 430 710 438 713 450
           L 633 586
           C 629 594 621 600 611 600
           L 258 600
           C 245 600 236 592 236 580
           Z"
        fill="#8a919e"
        transform="translate(0, 10)"
      />
      <!-- Cara frontal principal -->
      <path
        d="M 236 450
           C 236 438 245 430 258 430
           L 688 430
           C 700 430 710 438 713 450
           L 633 586
           C 629 594 621 600 611 600
           L 258 600
           C 245 600 236 592 236 580
           Z"
        fill="url(#midWhiteGrad)"
        stroke="url(#bevelLight)"
        stroke-width="7"
      />
      <!-- Brillo de bisel superior interno -->
      <path
        d="M 248 438
           L 686 438"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.8"
      />
    </g>

    <!-- 3. BARRA INFERIOR (Bloque Azul con corte diagonal derecho) -->
    <g>
      <!-- Sombra inferior de bisel 3D -->
      <path
        d="M 236 656
           C 236 644 245 636 258 636
           L 532 636
           C 544 636 554 644 557 656
           L 446 838
           C 442 846 434 852 424 852
           L 258 852
           C 245 852 236 844 236 832
           Z"
        fill="#1a374e"
        transform="translate(0, 10)"
      />
      <!-- Cara frontal principal -->
      <path
        d="M 236 656
           C 236 644 245 636 258 636
           L 532 636
           C 544 636 554 644 557 656
           L 446 838
           C 442 846 434 852 424 852
           L 258 852
           C 245 852 236 844 236 832
           Z"
        fill="url(#botBlueGrad)"
        stroke="url(#bevelLight)"
        stroke-width="7"
      />
      <!-- Brillo de bisel superior interno -->
      <path
        d="M 248 644
           L 530 644"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.45"
      />
    </g>

  </g>
</svg>
